name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        # Diagnostic only: a full artifact storage quota must not fail the quality gate; test failures still do.
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .qa/uiux-sprint-8/screenshots/
          retention-days: 14

  # Trial job: proves that the Docker Compose backend stack builds and the integration suite runs on a
  # GitHub runner. It must not block merges until a green run and its duration are recorded in docs/TESTING.md.
  backend-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      # The containers write to ./.data/files as a non-runner user.
      - run: chmod -R a+rwX .data
      - run: docker compose version
      - run: pnpm test
      - name: Compose status and recent logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 engine migrate api worker
