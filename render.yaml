services:
  # 1. DoctorConverter All-in-One API + Engine + Worker (Docker)
  - type: web
    name: doctorconverter-api
    runtime: docker
    dockerfilePath: ./infra/engine.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0
      - key: ENGINE_URL
        value: http://127.0.0.1:3002
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENGINE_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /tmp/data

  # 2. DoctorConverter Frontend (Astro Static Site)
  - type: web
    name: doctorconverter-web
    runtime: static
    buildCommand: pnpm --filter @convertsite/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: PUBLIC_API_URL
        sync: false # Buraya doctorconverter-api servisinin Render URL'si yazılacak
