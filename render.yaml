services:
  # 1. DoctorConverter All-in-One API + Engine + Worker (Docker)
  - type: web
    name: doctorconverter-api
    runtime: docker
    dockerfilePath: ./infra/engine.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0
      - key: ENGINE_URL
        value: http://127.0.0.1:3002
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENGINE_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Measured on Render: Cloudflare edge sets cf-connecting-ip (client copies are rejected with 403)
      # and X-Forwarded-For arrives with 3 entries, so 3 hops is the fallback when the header is absent.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY_HOPS
        value: 3
      - key: DATA_DIR
        value: /tmp/data

  # 2. DoctorConverter Frontend (Astro Static Site)
  - type: web
    name: doctorconverter-web
    runtime: static
    buildCommand: pnpm --filter @convertsite/web build
    staticPublishPath: ./apps/web/dist
    headers:
      # Content-hashed build assets never change; images change rarely.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /og/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /guides/*
        name: Cache-Control
        value: public, max-age=604800
    envVars:
      - key: PUBLIC_API_URL
        sync: false # https://api.doctorconverter.com (Cloudflare'de DNS only CNAME; frontend ile aynı site, cookie birinci taraf)
      - key: NODE_VERSION
        value: 22.23.4
