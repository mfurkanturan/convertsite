services:
  # 1. DoctorConverter All-in-One API + Engine + Worker (Docker)
  - type: web
    name: doctorconverter-api
    runtime: docker
    dockerfilePath: ./infra/engine.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0
      - key: ENGINE_URL
        value: http://127.0.0.1:3002
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENGINE_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Measured on Render: Cloudflare edge sets cf-connecting-ip (client copies are rejected with 403)
      # and X-Forwarded-For arrives with 3 entries, so 3 hops is the fallback when the header is absent.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY_HOPS
        value: 3
      - key: DATA_DIR
        value: /tmp/data

  # 2. DoctorConverter Frontend (Astro Static Site)
  - type: web
    name: doctorconverter-web
    runtime: static
    buildCommand: pnpm --filter @convertsite/web build
    staticPublishPath: ./apps/web/dist
    routes:
      # Legacy English-prefixed URLs use real HTTP 301s. Only equivalent current routes are mapped.
      - type: redirect
        source: /en
        destination: /
      - type: redirect
        source: /en/
        destination: /
