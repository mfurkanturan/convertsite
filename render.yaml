services:
  # DoctorConverter All-in-One API + Engine + Worker (Docker)
  - type: web
    name: doctorconverter-api
    runtime: docker
    dockerfilePath: ./infra/engine.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 3001
      - key: API_HOST
        value: 0.0.0.0
      - key: ENGINE_URL
        value: http://127.0.0.1:3002
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENGINE_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /tmp/data
